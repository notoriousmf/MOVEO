<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MOVEO</title>
<style>
:root{--y:#FFD21F;--k:#000;--t:#222;--g:#f2f2ee;--l:#d6d6d0;--m:#6b6b66}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--g);color:var(--t)}
header{background:var(--k);color:var(--y);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:24px;letter-spacing:3px}
header a{color:var(--y);text-decoration:none;margin-left:16px;font-size:15px}
main{max-width:720px;margin:0 auto;padding:14px 14px 60px}
h2{margin:8px 0 4px;font-size:24px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:8px;font:inherit;background:#fff;color:var(--t)}
textarea{min-height:80px}
label{display:block;margin:10px 0;font-size:14px;color:var(--m)}
.card{display:block;background:#fff;border-radius:10px;padding:12px;margin:8px 0;text-decoration:none;color:inherit;border-left:6px solid var(--y)}
.card small{display:block;color:var(--m)}
.tag{float:right;font-size:12px;background:var(--k);color:var(--y);padding:2px 9px;border-radius:10px}
.btn{display:block;background:var(--y);color:var(--k);font:inherit;font-weight:700;padding:13px 16px;border:0;border-radius:10px;text-align:center;text-decoration:none;margin:10px 0;cursor:pointer;width:100%}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;gap:8px;margin:10px 0}
.chip{padding:8px 14px;border:1px solid var(--l);border-radius:20px;background:#fff;font:inherit;cursor:pointer}
.chip.on{background:var(--k);color:var(--y);border-color:var(--k)}
.tabs{display:flex;border-bottom:2px solid var(--l);margin:12px 0}
.tabs a{flex:1;text-align:center;padding:10px;text-decoration:none;color:var(--m)}
.tabs a.on{color:var(--k);font-weight:700;border-bottom:4px solid var(--y);margin-bottom:-2px}
.back{display:inline-block;margin:4px 0;color:var(--t);text-decoration:none}
.m{color:var(--m)}
.lnk{background:none;border:0;color:#a02020;padding:6px 0;font:inherit;cursor:pointer;text-decoration:underline}
.ck{display:flex;gap:8px;align-items:center;color:var(--t);font-size:15px;margin:6px 0}
.ck input{width:auto}.ck small{color:var(--m)}
.xl{max-height:42vh;overflow:auto;background:#fff;border-radius:8px;padding:4px 10px;margin:8px 0}
.cap{background:#fff;border-radius:10px;padding:10px;margin:8px 0}
.cap input[name^=n]{margin-top:8px}
.sc{display:flex;gap:6px;margin-top:6px}
.sc label{margin:0;flex:1}.sc input{display:none}
.sc span{display:block;text-align:center;padding:10px 0;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--t);cursor:pointer}
.sc input:checked+span{background:var(--y);border-color:var(--k);color:var(--k);font-weight:700}
details{background:#fff;border-radius:10px;padding:10px;margin:8px 0}
summary{cursor:pointer}
.r{display:flex;flex-wrap:wrap;justify-content:space-between;margin:4px 0}.r small{flex-basis:100%;color:var(--m)}
.rd{width:100%;max-width:380px;display:block;margin:0 auto}
.ex{display:flex;justify-content:space-between;gap:8px;padding:10px 2px;border-top:1px solid var(--l);text-decoration:none;color:inherit}.ex small{color:var(--m);white-space:nowrap}.ar{margin:14px 0 2px;font-weight:700}
</style></head><body>

const LIB=[{"id":"C1-L1-01","sez":"c","cap":"Orientamento spazio-temporale","cap0":"Orientamento spazio-temporale","liv":"L1","eta":"4-6","nome":"Semafori sul posto","desc":"Muoversi liberamente nello spazio; al segnale fermarsi accanto al cono del colore chiamato.","mat":"Coni colorati","fac":"Un solo colore da cercare","dif":"Due colori da toccare in sequenza","leva":"Complessità","dur":"3","oss":"Si orienta senza urtare gli altri? Trova il cono con facilità?","err":""},{"id":"C1-L2-01","sez":"c","cap":"Orientamento spazio-temporale","cap0":"Orientamento spazio-temporale","liv":"L2","eta":"4-8","nome":"Percorso a frecce","desc":"Seguire un percorso segnato a terra con frecce: avanti, laterale, indietro.","mat":"Nastro adesivo o frecce di carta","fac":"Percorso corto, solo avanti e laterale","dif":"Percorso più lungo con cambi di ritmo","leva":"Complessità","dur":"4","oss":"Sceglie la direzione giusta senza fermarsi a pensare?","err":""},{"id":"C1-L3-01","sez":"c","cap":"Orientamento spazio-temporale","cap0":"Orientamento spazio-temporale","liv":"L3","eta":"6-10","nome":"Navigatore","desc":"Percorso a coni con consegne verbali: sopra, sotto, attorno, dietro.","mat":"Coni, cerchi, asticelle basse","fac":"Consegne una alla volta","dif":"Tre consegne in sequenza da memorizzare","leva":"Complessità","dur":"5","oss":"Ricorda la sequenza? Ha buona percezione dello spazio rispetto agli oggetti?","err":""},{"id":"C1-L4-01","sez":"c","cap":"Orientamento spazio-temporale","cap0":"Orientamento spazio-temporale","liv":"L4","eta":"6-12","nome":"Cambio di rotta","desc":"Percorso con segnali visivi (colore o numero mostrato) che decidono la direzione da prendere.","mat":"Coni, cartellini colorati","fac":"Segnale mostrato in anticipo","dif":"Segnale mostrato all'ultimo momento","leva":"Incertezza","dur":"5","oss":"Cambia direzione senza rallentare? Legge il segnale in tempo?","err":""},{"id":"C1-L5-01","sez":"c","cap":"Orientamento spazio-temporale","cap0":"Orientamento spazio-temporale","liv":"L5","eta":"8+","nome":"Rotta e calcolo","desc":"Stesso percorso a segnali, mentre si risolve un semplice calcolo o si nominano parole a tema.","mat":"Coni, cartellini","fac":"Calcoli molto semplici","dif":"Calcoli più complessi o categorie più difficili","leva":"Carico cognitivo","dur":"5","oss":"Mantiene qualità del movimento mentre risponde?","err":""},{"id":"C2-L1-01","sez":"c","cap":"Equilibrio","cap0":"Equilibrio","liv":"L1","eta":"4-6","nome":"Cicogna","desc":"Stare su un piede in posizione stabile per 5-10 secondi, poi cambiare piede.","mat":"Nessuno o tappetino","fac":"Appoggio leggero della mano a un supporto","dif":"Occhi chiusi o braccia incrociate","leva":"Stabilità","dur":"2","oss":"Tempo di tenuta, oscillazioni, differenza tra i due lati","err":""},{"id":"C2-L2-01","sez":"c","cap":"Equilibrio","cap0":"Equilibrio","liv":"L2","eta":"4-8","nome":"Linea con oggetto","desc":"Camminare su una linea a terra portando un oggetto sul palmo o sulla testa.","mat":"Nastro a terra, sacchetto di sabbia o peluche","fac":"Linea larga, oggetto in mano senza altro","dif":"Camminata all'indietro o laterale","leva":"Complessità","dur":"3","oss":"Controllo del tronco, sguardo, cadute dell'oggetto","err":""},{"id":"C2-L3-01","sez":"c","cap":"Equilibrio","cap0":"Equilibrio","liv":"L3","eta":"6-10","nome":"Equilibrio e lancio","desc":"In appoggio su un piede, lanciare e riprendere un palloncino o una pallina morbida.","mat":"Palloncini, palline morbide","fac":"Appoggio a due piedi","dif":"Piede unico con lancio da altezze diverse","leva":"Complessità","dur":"4","oss":"Mantiene l'equilibrio mentre segue l'oggetto?","err":""},{"id":"C2-L4-01","sez":"c","cap":"Equilibrio","cap0":"Equilibrio","liv":"L4","eta":"6-12","nome":"Superficie instabile a segnale","desc":"Su cuscino o tappetino morbido, al segnale cambiare piede o girarsi senza scendere.","mat":"Cuscini propriocettivi o tappetini morbidi","fac":"Superficie più ferma","dif":"Superficie più instabile, segnale più rapido","leva":"Stabilità","dur":"4","oss":"Recupero dell'equilibrio, strategie del bacino e delle braccia","err":""},{"id":"C2-L5-01","sez":"c","cap":"Equilibrio","cap0":"Equilibrio","liv":"L5","eta":"8+","nome":"Equilibrio e decisione","desc":"Camminare su linea o asse basso dando passaggi o rispondendo a domande rapide.","mat":"Asse basso o linea, palla","fac":"Passaggi lenti e semplici","dif":"Passaggi con scelta di direzione e conteggio","leva":"Carico cognitivo","dur":"5","oss":"Fluidità del passo, qualità dell'appoggio mentre decide","err":""},{"id":"C3-L1-01","sez":"c","cap":"Ritmo","cap0":"Ritmo","liv":"L1","eta":"4-6","nome":"Eco di mani","desc":"Ripetere battiti di mani o schemi sonori semplici a 2-3 tempi proposti dall'istruttore.","mat":"Nessuno","fac":"Solo 2 tempi","dif":"Schema di 4-5 tempi","leva":"Complessità","dur":"2","oss":"Riproduce lo schema senza anticipare né ritardare?","err":""},{"id":"C3-L2-01","sez":"c","cap":"Ritmo","cap0":"Ritmo","liv":"L2","eta":"4-8","nome":"Saltelli a ritmo","desc":"Saltare dentro e fuori da cerchi a terra seguendo una cadenza (battiti o musica).","mat":"Cerchi, musica o tamburello","fac":"Cadenza lenta e costante","dif":"Cadenza che cambia dopo 4 battiti","leva":"Velocità","dur":"4","oss":"Sincronia tra salto e battito","err":""},{"id":"C3-L3-01","sez":"c","cap":"Ritmo","cap0":"Ritmo","liv":"L3","eta":"6-10","nome":"Passo e controtempo","desc":"Camminare a tempo e contemporaneamente battere le mani in controtempo.","mat":"Musica o metronomo","fac":"Solo passo a tempo, poi aggiungere le mani","dif":"Battito a ritmo diverso dal passo","leva":"Complessità","dur":"4","oss":"Mantiene entrambi i ritmi senza confonderli?","err":""},{"id":"C3-L4-01","sez":"c","cap":"Ritmo","cap0":"Ritmo","liv":"L4","eta":"6-12","nome":"Cambio di cadenza","desc":"Seguire un ritmo che accelera, rallenta o cambia a segnale, spostandosi nello spazio.","mat":"Musica con tempo variabile, tamburello","fac":"Cambi annunciati","dif":"Cambi senza preavviso","leva":"Incertezza","dur":"4","oss":"Si adatta al nuovo tempo entro 1-2 battiti?","err":""},{"id":"C3-L5-01","sez":"c","cap":"Ritmo","cap0":"Ritmo","liv":"L5","eta":"8+","nome":"Ritmo e memoria","desc":"Imparare una sequenza ritmico-motoria di 8 tempi e ripeterla a memoria, poi variarla a scelta.","mat":"Musica, cerchi, coni","fac":"Sequenza di 4 tempi","dif":"Sequenza di 12 tempi con variazioni","leva":"Carico cognitivo","dur":"5","oss":"Precisione ritmica e qualità del gesto a memoria","err":""},{"id":"C4-L1-01","sez":"c","cap":"Differenziazione cinestesica","cap0":"Differenziazione cinestesica","liv":"L1","eta":"4-6","nome":"Piano e forte","desc":"Lanciare un sacchetto o una palla leggera vicino o lontano secondo la richiesta (piano / forte).","mat":"Sacchetti di sabbia, palline morbide","fac":"Solo due distanze","dif":"Quattro distanze diverse","leva":"Complessità","dur":"3","oss":"Corrisponde la forza richiesta alla distanza raggiunta?","err":""},{"id":"C4-L2-01","sez":"c","cap":"Differenziazione cinestesica","cap0":"Differenziazione cinestesica","liv":"L2","eta":"4-8","nome":"Bersagli a distanze","desc":"Lanciare a bersagli posti a 3 distanze diverse, nominate dall'istruttore.","mat":"Cerchi o scatole come bersagli, palline","fac":"Distanze molto diverse tra loro","dif":"Distanze ravvicinate tra loro","leva":"Complessità","dur":"4","oss":"Precisione e adattamento della forza","err":""},{"id":"C4-L3-01","sez":"c","cap":"Differenziazione cinestesica","cap0":"Differenziazione cinestesica","liv":"L3","eta":"6-10","nome":"Stesso bersaglio, palla diversa","desc":"Colpire lo stesso bersaglio con palle di peso e dimensione diverse.","mat":"Palle di peso diverso (tennis, soffice, medicinale leggera)","fac":"Due palle sole","dif":"Cambio palla a ogni tentativo senza prove","leva":"Variabilità","dur":"5","oss":"Riesce a ricalibrare la forza tra una palla e l'altra?","err":""},{"id":"C4-L4-01","sez":"c","cap":"Differenziazione cinestesica","cap0":"Differenziazione cinestesica","liv":"L4","eta":"6-12","nome":"Dosa in movimento","desc":"Lanciare a un bersaglio mentre ci si sposta o a un bersaglio che si muove lentamente.","mat":"Bersagli mobili, palline","fac":"Bersaglio fermo, spostamento lento","dif":"Bersaglio più veloce o più piccolo","leva":"Velocità","dur":"5","oss":"Precisione sotto cambiamenti di velocità e distanza","err":""},{"id":"C4-L5-01","sez":"c","cap":"Differenziazione cinestesica","cap0":"Differenziazione cinestesica","liv":"L5","eta":"8+","nome":"Dosa e decidi","desc":"Scegliere il bersaglio in base a un colore chiamato, con distanze diverse e punteggio da contare.","mat":"Bersagli colorati, palline","fac":"Un solo colore, distanze costanti","dif":"Più colori, distanze variabili, punteggio","leva":"Carico cognitivo","dur":"5","oss":"Precisione e rapidità di decisione insieme","err":""},{"id":"C5-L1-01","sez":"c","cap":"Reazione","cap0":"Reazione","liv":"L1","eta":"4-6","nome":"Scatta al colore","desc":"Al segnale visivo (colore alzato) scattare per 3-5 metri fino a una linea.","mat":"Cartellini colorati, coni","fac":"Segnale sonoro in alternativa","dif":"Partenza da posizioni diverse (seduto, a terra)","leva":"Incertezza","dur":"2","oss":"Tempo di partenza e direzione corretta","err":""},{"id":"C5-L2-01","sez":"c","cap":"Reazione","cap0":"Reazione","liv":"L2","eta":"4-8","nome":"Afferra l'oggetto","desc":"L'istruttore lascia cadere un foglio, un nastro o un anello: afferrarlo prima che tocchi terra.","mat":"Nastri, anelli, fogli","fac":"Caduta da altezza maggiore","dif":"Caduta da altezza minore, mano non dominante","leva":"Velocità","dur":"3","oss":"Tempo di risposta e precisione della presa","err":""},{"id":"C5-L3-01","sez":"c","cap":"Reazione","cap0":"Reazione","liv":"L3","eta":"6-10","nome":"Scatta o schiva","desc":"Due segnali diversi, due azioni: scattare a un cono oppure schivare di lato.","mat":"Coni, cartellini","fac":"Un segnale per volta","dif":"Segnali in ordine casuale e più ravvicinati","leva":"Complessità","dur":"4","oss":"Sceglie l'azione corretta e la esegue subito?","err":""},{"id":"C5-L4-01","sez":"c","cap":"Reazione","cap0":"Reazione","liv":"L4","eta":"6-12","nome":"Tre segnali, tre azioni","desc":"Tre segnali diversi (colori o suoni) associati a tre azioni, in ordine casuale.","mat":"Cartellini, coni, cerchi","fac":"Due segnali soli","dif":"Segnali con anticipo minimo","leva":"Incertezza","dur":"5","oss":"Errori di scelta, velocità sotto pressione","err":""},{"id":"C5-L5-01","sez":"c","cap":"Reazione","cap0":"Reazione","liv":"L5","eta":"8+","nome":"Reazione e doppio compito","desc":"Rispondere ai segnali mentre si palleggia, si conduce una palla o si conta ad alta voce.","mat":"Palla, cartellini","fac":"Doppio compito semplice (solo conteggio)","dif":"Palleggio con mano non dominante + calcolo","leva":"Carico cognitivo","dur":"5","oss":"La qualità dell'azione resta stabile con il secondo compito?","err":""},{"id":"C6-L1-01","sez":"c","cap":"Reazione","cap0":"Anticipazione","liv":"L1","eta":"4-6","nome":"Dove si ferma?","desc":"Osservare una pallina che rotola e posizionarsi dove si fermerà prima che arrivi.","mat":"Palline di varie dimensioni","fac":"Rotolamento lento e in linea retta","dif":"Rotolamento con curve o su piano inclinato","leva":"Velocità","dur":"3","oss":"Il bambino si sposta prima o dopo l'arrivo della pallina?","err":""},{"id":"C6-L2-01","sez":"c","cap":"Reazione","cap0":"Anticipazione","liv":"L2","eta":"4-8","nome":"Intercetta la palla","desc":"Una palla rotola in traiettoria lenta: intercettarla bloccandola con le mani o i piedi.","mat":"Palle morbide","fac":"Traiettoria dritta e molto lenta","dif":"Traiettorie diagonali e più veloci","leva":"Velocità","dur":"4","oss":"Lettura della traiettoria e tempismo","err":""},{"id":"C6-L3-01","sez":"c","cap":"Reazione","cap0":"Anticipazione","liv":"L3","eta":"6-10","nome":"Rimbalzo previsto","desc":"Lanciare una palla contro un muro e posizionarsi per riprenderla dopo il rimbalzo.","ma o","liv":"L3","eta":"6-10","nome":"Salta e ruota","desc":"Salto con mezza rotazione e atterraggio stabile su due piedi.","mat":"Cerchi a terra","fac":"Rotazione solo di un quarto","dif":"Rotazione completa, atterraggio su un piede","leva":"Complessità","dur":"4","oss":"Atterraggio stabile, controllo della rotazione","err":""},{"id":"C7-L4-01","sez":"c","cap":"Combinazione e accoppiamento","cap0":"Combinazione/accoppiamento","liv":"L4","eta":"6-12","nome":"Sequenza a scelta","desc":"Sequenza di 3 gesti (es. salta, ruota, lancia) con ordine che cambia a un segnale.","mat":"Cerchi, palla, coni","fac":"Ordine fisso, poi cambio dopo 3 ripetizioni","dif":"Ordine che cambia a ogni passaggio","leva":"Incertezza","dur":"5","oss":"Fluidità nel passaggio tra i gesti","err":""},{"id":"C7-L5-01","sez":"c","cap":"Combinazione e accoppiamento","cap0":"Combinazione/accoppiamento","liv":"L5","eta":"8+","nome":"Sequenza e doppio compito","desc":"Eseguire la sequenza motoria mentre si risponde a domande o si conta.","mat":"Cerchi, palla","fac":"Compito cognitivo semplice","dif":"Domande più impegnative, velocità maggiore","leva":"Carico cognitivo","dur":"5","oss":"Qualità motoria e correttezza della risposta","err":""},{"id":"C8-L1-01","sez":"c","cap":"Adattamento e trasformazione","cap0":"Adattamento/trasformazione","liv":"L1","eta":"4-6","nome":"Stesso gioco, terreno diverso","desc":"Ripetere un percorso semplice su superfici diverse (tappeto, erba, cuscini bassi).","mat":"Superfici diverse a disposizione","fac":"Superfici simili tra loro","dif":"Superfici molto diverse","leva":"Variabilità","dur":"3","oss":"Come cambia il passo e il controllo sulle superfici?","err":""},{"id":"C8-L2-01","sez":"c","cap":"Adattamento e trasformazione","cap0":"Adattamento/trasformazione","liv":"L2","eta":"4-8","nome":"Cambia attrezzo","desc":"Stesso gesto (es. lanciare) con attrezzi diversi: palla, cuscino, anello, sacchetto.","mat":"Attrezzi vari","fac":"Attrezzi simili per forma","dif":"Attrezzi mol const age=n=>n?Math.floor((Date.now()-new Date(n))/31557600000):null;
const exn=id=>(db.ex.find(e=>e.id==id)||{nome:'(esercizio eliminato)'}).nome;
const lastS=cid=>db.sessions.filter(s=>s.cl.includes(cid)).sort((a,b)=>b.data.localeCompare(a.data))[0];
let q='',ft='',dq='',dc='';

/* Clienti */
const list=()=>db.clients.filter(c=>(!ft||c.tipo==ft)&&c.nome.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>{const s=lastS(c.id),a=age(c.nascita);return`<a class=card href="#/c/${c.id}/v"><span class=tag>${c.tipo=='societa'?'Società':'Privato'}</span><b>${esc(c.nome)}</b><small>${a!=null?a+' anni · ':''}ultima sessione: ${s?fd(s.data):'nessuna'}</small></a>`}).join('')||'<p class=m>Nessun cliente trovato. Aggiungine uno.</p>';
const home=()=>`<input id=q placeholder="Cerca cliente…" value="${esc(q)}"><div class=chips>${[['','Tutti'],['privato','Privati'],['societa','Società']].map(([v,t])=>`<button class="chip ${ft==v?'on':''}" data-f="${v}">${t}</button>`).join('')}</div><div id=list>${list()}</div><a class=btn href="#/n">+ Nuovo cliente</a>`;

function client(id,tab){
 const c=db.clients.find(x=>x.id==id);if(!c)return'<p>Cliente non trovato.</p>';
 return`<a href="#/" class=back>‹ Clienti</a><h2>${esc(c.nome)}</h2>
 <div class=row><a class=btn href="#/s/${id}">+ Sessione</a><a class=btn href="#/v/${id}">+ Valutazione</a></div>
 <div class=tabs>${[['v','Valutazioni'],['s','Sessioni'],['i','Info']].map(([k,t])=>`<a class="${tab==k?'on':''}" href="#/c/${id}/${k}">${t}</a>`).join('')}</div>
 ${tab=='s'?sess(c):tab=='i'?info(c):evals(c)}`}

function radar(E){
 const n=11,R=105,C=170,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[C+Math.cos(a)*R*v/5,C+Math.sin(a)*R*v/5].map(x=>x.toFixed(1))};
 const ps=r=>CAPS.map((_,i)=>pt(i,r).join(',')).join(' ');
 const poly=(e,s)=>`<polygon points="${CAPS.map((_,i)=>pt(i,e.p[i].v).join(',')).join(' ')}" ${s}/>`;
 const f=E[0],l=E[E.length-1];
 return`<svg viewBox="0 0 340 340" class=rd>${[1,2,3,4,5].map(r=>`<polygon points="${ps(r)}" fill="none" stroke="#ccc"/>`).join('')}${CAPS.map((_,i)=>{const[x,y]=pt(i,5.9);return`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#555">${i+1}</text>`}).join('')}${E.length>1?poly(f,'fill="#999" fill-opacity=".15" stroke="#777" stroke-dasharray="4 3" stroke-width="2"'):''}${poly(l,'fill="#FFD21F" fill-opacity=".55" stroke="#000" stroke-width="2"')}</svg>
 <p class=m><small>${E.length>1?`Tratteggio grigio: ${fd(f.data)} · Giallo: ${fd(l.data)}`:`Valutazione del ${fd(l.data)}`}</small></p>
 <p class=m><small>${CAPS.map((c,i)=>`${i+1} ${c}`).join(' · ')}</small></p>`}

function evals(c){
 const E=db.evals.filter(e=>e.cid==c.id).sort((a,b)=>a.data.localeCompare(b.data));
 if(!E.length)return'<p class=m>Nessuna valutazione. Tocca “+ Valutazione” per iniziare.</p>';
 return radar(E)+E.slice().reverse().map(e=>{const s=e.p.filter(x=>x.v),m=s.length?(s.reduce((a,x)=>a+x.v,0)/s.length).toFixed(1):'–';
 return`<details><summary><b>${fd(e.data)}</b> ${esc(e.tipo)} · media ${m}</summary>${e.op?`<small class=m>Operatore: ${esc(e.op)}</small>`:''}${CAPS.map((c,i)=>`<p class=r><span>${i+1} ${c}</span><b>${e.p[i].v||'–'}</b>${e.p[i].n?`<small>${esc(e.p[i].n)}</small>`:''}</p>`).join('')}${[['Punti di forza',e.forza],['Aree prioritarie di lavoro',e.aree],['Considerazioni sul cliente',e.cons]].map(([t,v])=>v?`<p><b>${t}</b><br>${esc(v)}</p>`:'').join('')}<button class=lnk data-del="v:${e.id}">Elimina valutazione</button></details>`}).join('')}

function sess(c){
 const S=db.sessions.filter(s=>s.cl.includes(c.id)).sort((a,b)=>b.data.localeCompare(a.data));
 return S.map(s=>`<div class=card><b>${fd(s.data)}</b> <small>${s.dur||'?'} min${s.cl.length>1?' · gruppo di '+s.cl.length:''}</small><ul>${s.ex.map(i=>`<li>${esc(exn(i))}</li>`).join('')}</ul>${s.note?`<small>${esc(s.note)}</small>`:''}<button class=lnk data-del="s:${s.id}">Elimina sessione</button></div>`).join('')||'<p class=m>Nessuna sessione. Tocca “+ Sessione” per registrarne una.</p>'}

function info(c){const a=age(c.nascita);return`<div class=card><p>Tipo: ${c.tipo=='societa'?'Società':'Privato'}</p>${a!=null?`<p>Età: ${a} anni</p>`:''}${c.obiettivo?`<p>Obiettivo: ${esc(c.obiettivo)}</p>`:''}${c.note?`<p>${esc(c.note)}</p>`:''}</div><a class=btn href="#/m/${c.id}">Modifica cliente</a><button class=lnk data-del="c:${c.id}">Elimina cliente e tutti i suoi dati</button>`}

function formC(id){const c=db.clients.find(x=>x.id==id)||{};
 return`<a href="${id?'#/c/'+id+'/i':'#/'}" class=back>‹ Indietro</a><h2>${id?'Modifica':'Nuovo'} cliente</h2>
 <form data-form=c data-id="${id||''}">
 <label>Nome (meglio un alias o le iniziali)<input name=nome required value="${esc(c.nome)}"></label>
 <label>Tipo<select name=tipo><option value=privato ${c.tipo=='privato'?'selected':''}>Privato</option><option value=societa ${c.tipo=='societa'?'selected':''}>Società</option></select></label>
 <label>Data di nascita<input type=date name=nascita value="${c.nascita||''}"></label>
 <label>Obiettivo<input name=obiettivo value="${esc(c.obiettivo)}"></label>
 <label>Note<textarea name=note>${esc(c.note)}</textarea></label>
 <button class=btn>Salva cliente</button></form>`}

function formS(cid){
 const c=db.clients.find(x=>x.id==cid);if(!c)return'<p>Cliente non trovato.</p>';
 const last=lastS(cid),use={};db.sessions.forEach(s=>s.ex.forEach(i=>use[i]=(use[i]||0)+1));
 const X=[...db.ex].sort((a,b)=>(use[b.id]||0)-(use[a.id]||0)||a.nome.localeCompare(b.nome));
 return`<a href="#/c/${cid}/s" class=back>‹ ${esc(c.nome)}</a><h2>Nuova sessione</h2>
 <form data-form=s data-id="${cid}">
 <div class=row><label>Data<input type=date name=data value="${today()}"></label><label>Durata (minuti)<input type=number name=dur value=20></label></div>
 ${db.clients.length>1?`<details><summary>Sessione di gruppo: aggiungi altri clienti</summary>${db.clients.filter(x=>x.id!=cid).map(x=>`<label class=ck><input type=checkbox name=cl value="${x.id}"> ${esc(x.nome)}</label>`).join('')}</details>`:''}
 <input id=xq placeholder="Cerca esercizio…">
 ${last?`<button type=button class=lnk id=dup data-ids="${last.ex.join(',')}">Ripeti gli esercizi dell’ultima sessione</button>`:''}
 <div id=xl class=xl>${X.map(e=>`<label class=ck data-n="${esc((e.nome+' '+e.cap).toLowerCase())}"><input type=checkbox name=ex value="${e.id}"> <span>${esc(e.nome)} <small>${esc(e.cap)}${e.liv?' · '+e.liv:''}</small></span></label>`).join('')||'<p class=m>La dispensa è vuota.</p>'}</div>
 <label>Note<textarea name=note></textarea></label>
 <button class=btn>Salva sessione</button></form>`}

function formV(cid){
 const c=db.clients.find(x=>x.id==cid);if(!c)return'<p>Cliente non trovato.</p>';
 const prev=db.evals.filter(e=>e.cid==cid).sort((a,b)=>b.data.localeCompare(a.data))[0];
 return`<a href="#/c/${cid}/v" class=back>‹ ${esc(c.nome)}</a><h2>Nuova valutazione</h2><p class=m>${c.tipo=='societa'?'Società: modello provvisorio con le stesse 11 voci della scheda individuale, in attesa della vostra scheda società.':'Scheda individuale (privato)'}</p>
 <form data-form=v data-id="${cid}">
 <div class=row><label>Data<input type=date name=data value="${today()}"></label><label>Tipo<select name=tipo><option>Iniziale</option><option ${prev?'selected':''}>Intermedia</option><option>Finale</option></select></label></div>
 <label>Operatore<input name=op value="${esc(prev&&prev.op)}"></label>
 <details><summary>Cosa significa ogni livello</summary>${LIV.map(l=>`<p>${l}</p>`).join('')}</details>
 ${CAPS.map((n,i)=>`<div class=cap><b>${i+1} · ${n}</b><div class=sc>${[1,2,3,4,5].map(v=>`<label><input type=radio name="v${i}" value=${v}><span>${v}</span></label>`).join('')}</div><input name="n${i}" placeholder="Priorità e osservazioni"></div>`).join('')}
 <label>Punti di forza<textarea name=forza></textarea></label>
 <label>Aree prioritarie di lavoro<textarea name=aree></textarea></label>
 <label>Considerazioni sul cliente<textarea name=cons></textarea></label>
 <button class=btn>Salva valutazione</button></form>`}

/* Dispensa */
const GR=['Orientamento spazio-temporale','Equilibrio','Ritmo','Differenziazione cinestesica','Reazione','Combinazione e accoppiamento','Adattamento e trasformazione'];
const ord=(a,b)=>(a.liv||'').localeCompare(b.liv||'')||a.nome.localeCompare(b.nome);
const item=e=>`<a class=ex href="#/e/${e.id}"><b>${esc(e.nome)}</b><small>${e.liv||''}${e.eta?' · '+esc(e.eta)+' anni':''}${e.dur?' · '+e.dur+' min':''}</small></a>`;
const dl=()=>{
 const X=db.ex.filter(e=>!dq||[e.nome,e.desc,e.mat].join(' ').toLowerCase().includes(dq.toLowerCase())),op=dq?' open':'';
 const g=(t,L)=>L.length?`<details${op}><summary><b>${esc(t)}</b> <small class=m>${L.length}</small></summary>${L.sort(ord).map(item).join('')}</details>`:'';
 const C=X.filter(e=>e.sez!='t'),T=X.filter(e=>e.sez=='t'),altre=[...new Set(C.map(e=>e.cap))].filter(c=>!GR.includes(c)).sort();
 const areas=[...new Set(T.map(e=>e.cap))].sort();
 return[...GR,...altre].map(c=>g(c,C.filter(e=>e.cap==c))).join('')+(T.length?`<details${op}><summary><b>Tecnica di corsa</b> <small class=m>${T.length}</small></summary>${areas.map(a=>`<p class=ar>${esc(a)}</p>${T.filter(e=>e.cap==a).sort(ord).map(item).join('')}`).join('')}</details>`:'')||'<p class=m>Nessun esercizio trovato.</p>'};
const dispensa=()=>`<h2>Dispensa esercizi</h2><input id=dq placeholder="Cerca esercizio…" value="${esc(dq)}"><div id=dl>${dl()}</div><a class=btn href="#/e/new">+ Nuovo esercizio</a>`;

/* Valutazioni (tutte) */
const chips=()=>`<div class=chips>${[['','Tutti'],['privato','Privati'],['societa','Società']].map(([v,t])=>`<button class="chip ${ft==v?'on':''}" data-f="${v}">${t}</button>`).join('')}</div>`;
function wlist(){
 const C=id=>db.clients.find(c=>c.id==id)||{nome:'(eliminato)'};
 const E=db.evals.filter(e=>!ft||C(e.cid).tipo==ft).sort((a,b)=>b.data.localeCompare(a.data));
 return`<h2>Valutazioni</h2>${chips()}<a class=btn href="#/w/n">+ Nuova valutazione</a>${E.map(e=>{const c=C(e.cid),s=e.p.filter(x=>x.v),m=s.length?(s.reduce((a,x)=>a+x.v,0)/s.length).toFixed(1):'–';return`<a class=card href="#/c/${e.cid}/v"><span class=tag>${c.tipo=='societa'?'Società':'Privato'}</span><b>${esc(c.nome)}</b><small>${fd(e.data)} · ${esc(e.tipo)} · media ${m}</small></a>`}).join('')||'<p class=m>Nessuna valutazione.</p>'}`}
const pick=()=>`<a href="#/w" class=back>‹ Valutazioni</a><h2>Per chi è la valutazione?</h2>${db.clients.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<a class=card href="#/v/${c.id}"><span class=tag>${c.tipo=='societa'?'Società':'Privato'}</span><b>${esc(c.nome)}</b></a>`).join('')||'<p class=m>Aggiungi prima un cliente o una società.</p>'}<a class=btn href="#/n">+ Nuovo cliente o società</a>`;

function exView(id){
 const e=db.ex.find(x=>x.id==id);if(!e)return'<p>Esercizio non trovato.</p>';
 const R=(t,v)=>v?`<p><b>${t}</b><br>${esc(v)}</p>`:'';
 return`<a href="#/d" class=back>‹ Dispensa</a><h2>${esc(e.nome)}</h2><p class=m>${esc(e.cap)}${e.liv?' · '+e.liv:''}${e.eta?' · '+esc(e.eta)+' anni':''}${e.dur?' · '+e.dur+' min':''}${e.leva?' · leva: '+esc(e.leva):''}</p>
 <div class=card>${R('Come si svolge',e.desc)}${R('Materiale',e.mat)}${R('Variante facilitata',e.fac)}${R('Variante più difficile',e.dif)}${R('Cosa osservare',e.oss)}${R('Errori comuni',e.err)}</div><a class=btn href="#/x/${e.id}">Modifica esercizio</a>`}

function formE(id){
 const e=db.ex.find(x=>x.id==id)||{},F=(n,t,ta)=>`<label>${t}${ta?`<textarea name=${n}>${esc(e[n])}</textarea>`:`<input name=${n} value="${esc(e[n])}">`}</label>`;
 return`<a href="${id?'#/e/'+id:'#/d'}" class=back>‹ Indietro</a><h2>${id?'Modifica':'Nuovo'} esercizio</h2>
 <form data-form=e data-id="${id||''}">
 <label>Nome<input name=nome required value="${esc(e.nome)}"></label>
 <label>Sezione<select name=sez><option value=c ${e.sez!='t'?'selected':''}>Coordinazione</option><option value=t ${e.sez=='t'?'selected':''}>Corsa</option></select></label>
 <label>Capacità o area tecnica<input name=cap list=cl required value="${esc(e.cap)}"><datalist id=cl>${[...new Set([...CAPS,...db.ex.map(x=>x.cap)])].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
 <div class=row>${F('liv','Livello (L1-L5)')}${F('eta','Fascia d’età')}${F('dur','Durata (min)')}</div>
 ${F('desc','Come si svolge',1)}${F('mat','Materiale')}${F('fac','Variante facilitata')}${F('dif','Variante più difficile')}${F('leva','Leva che cambia')}${F('oss','Cosa osservare',1)}${F('err','Errori comuni',1)}
 <button class=btn>Salva esercizio</button>${id?`<button type=button class=lnk data-del="e:${id}">Elimina esercizio</button>`:''}</form>`}

const backup=()=>`<h2>Backup</h2><p class=m>I dati restano solo in questo browser, su questo dispositivo. Esporta un backup ogni tanto e conservalo fuori da GitHub.</p><button class=btn id=exp>Esporta backup</button><label>Importa un backup<input type=file id=imp accept=".json"></label>`;

/* Navigazione */
function render(){
 const[a,b,c]=location.hash.slice(2).split('/');
 $('main').innerHTML=a=='c'?client(b,c||'v'):a=='n'?formC():a=='m'?formC(b):a=='s'?formS(b):a=='v'?formV(b):a=='w'?(b=='n'?pick():wlist()):a=='d'?dispensa():a=='e'?(b=='new'?formE(''):exView(b)):a=='x'?formE(b):a=='b'?backup():home();
 scrollTo(0,0)}
addEventListener('hashchange',render);

document.addEventListener('submit',ev=>{
 ev.preventDefault();const f=ev.target,k=f.dataset.form,id=f.dataset.id,d=new FormData(f);
 if(k=='c'){const o={nome:d.get('nome').trim(),tipo:d.get('tipo'),nascita:d.get('nascita'),obiettivo:d.get('obiettivo'),note:d.get('note')};
  if(id)Object.assign(db.clients.find(x=>x.id==id),o);else{o.id=uid();db.clients.push(o)}
  save();location.hash=id?'#/c/'+id+'/i':'#/c/'+o.id+'/v'}
 if(k=='s'){db.sessions.push({id:uid(),cl:[id,...d.getAll('cl')],data:d.get('data'),dur:+d.get('dur')||0,ex:d.getAll('ex'),note:d.get('note')});save();location.hash='#/c/'+id+'/s'}
 if(k=='v'){db.evals.push({id:uid(),cid:id,data:d.get('data'),tipo:d.get('tipo'),op:d.get('op'),p:CAPS.map((_,i)=>({v:+d.get('v'+i)||0,n:d.get('n'+i)||''})),forza:d.get('forza'),aree:d.get('aree'),cons:d.get('cons')});save();location.hash='#/c/'+id+'/v'}
 if(k=='e'){const o={nome:d.get('nome').trim(),sez:d.get('sez')};['cap','liv','eta','dur','desc','mat','fac','dif','leva','oss','err'].forEach(x=>o[x]=d.get(x).trim());
  if(id)Object.assign(db.ex.find(x=>x.id==id),o);else{o.id=uid();db.ex.push(o)}
  save();location.hash='#/d'}});

document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-f],[data-del],#dup,#exp');if(!t)return;
 if(t.dataset.f!==undefined){ft=t.dataset.f;render()}
 else if(t.dataset.del){const[k,id]=t.dataset.del.split(':');if(!confirm('Eliminare definitivamente?'))return;
  if(k=='s')db.sessions=db.sessions.filter(x=>x.id!=id);
  if(k=='v')db.evals=db.evals.filter(x=>x.id!=id);
  if(k=='e')db.ex=db.ex.filter(x=>x.id!=id);
  if(k=='c'){db.clients=db.clients.filter(x=>x.id!=id);db.evals=db.evals.filter(x=>x.cid!=id);db.sessions.forEach(s=>s.cl=s.cl.filter(x=>x!=id));db.sessions=db.sessions.filter(s=>s.cl.length)}
  save();location.hash=k=='c'?'#/':k=='e'?'#/d':location.hash;render()}
 else if(t.id=='dup'){const ids=t.dataset.ids.split(',');document.querySelectorAll('[name=ex]').forEach(i=>i.checked=ids.includes(i.value))}
 else if(t.id=='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='moveo-backup-'+today()+'.json';a.click()}});

document.addEventListener('input',ev=>{const t=ev.target;
 if(t.id=='q'){q=t.value;$('#list').innerHTML=list()}
 if(t.id=='dq'){dq=t.value;$('#dl').innerHTML=dl()}
 if(t.id=='xq')document.querySelectorAll('#xl label').forEach(l=>l.hidden=!l.dataset.n.includes(t.value.toLowerCase()))});

document.addEventListener('change',ev=>{const t=ev.target;
 
 if(t.id=='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.clients))throw 0;if(!confirm('Sostituire tutti i dati attuali con il backup?'))return;db=o;save();render()}catch(x){alert('File non valido.')}};r.readAsText(t.files[0])}});

render();
</script></body></html>
